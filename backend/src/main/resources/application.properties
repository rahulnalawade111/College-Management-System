spring.application.name=college-management
server.port=${SERVER_PORT:8080}
server.error.include-message=always

# ---- Database (values come from the environment; see README) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:college_management}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

# ---- JPA / Hibernate (Flyway owns the schema) ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# MariaDB 11.x reports as MySQL in jdbc metadata; pin the dialect explicitly
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ---- JWT ----
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- File uploads ----
file.upload.directory=${FILE_UPLOAD_DIR:/workspace/uploads}
file.upload.max-size-mb=5
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---- CORS (comma-separated list of allowed origins) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
